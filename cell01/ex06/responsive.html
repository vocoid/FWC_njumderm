<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Table</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        table {
            width: 100%;
            height: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }

        td {
            width: 50%;
            padding: 20px;
            border: 1px solid black;
            vertical-align: middle;
        }

        td:first-child {
            background-color: #a7f9ff;
        }

        td:last-child {
            background-color: #ff9090;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td>blue</td>
            <td>red</td>
        </tr>
    </table>

</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rush Portfolios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, #1f2937 0%, #4b5563 100%);
      color: #fff;
    }
    .profile-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 1rem;
      transition: transform .2s ease, background .2s ease;
    }
    .profile-card:hover {
      transform: translateY(-6px);
      background: rgba(255, 255, 255, 0.16);
    }
    .avatar { width: 120px; height: 120px; object-fit: cover; }
  </style>
</head>
<body>

  <div class="container py-5">

    <div class="text-center mb-5">
      <h1 class="fw-bold">Rush Portfolios</h1>
      <p class="lead text-white-50">Piscine Discovery 42 Bangkok</p>
    </div>

    <div class="row justify-content-center g-4">

      <div class="col-sm-8 col-md-5">
        <a href="cv1.html" class="text-decoration-none text-white">
          <div class="profile-card h-100 text-center p-4">
            <img src="src/1.png" alt="Pawin Srisiriwat" class="avatar rounded-circle mb-3">
            <h4 class="mb-1">Pawin Srisiriwat</h4>
            <p class="text-white-50 mb-3">psrisiri</p>
            <span class="btn btn-light btn-sm">ดูพอร์ตโฟลิโอ</span>
          </div>
        </a>
      </div>

      <div class="col-sm-8 col-md-5">
        <a href="cv2.html" class="text-decoration-none text-white">
          <div class="profile-card h-100 text-center p-4">
            <img src="assets/avatar.jpg" alt="Natakorn Jumderm" class="avatar rounded-circle mb-3">
            <h4 class="mb-1">Natakorn Jumderm</h4>
            <p class="text-white-50 mb-3">njumderm</p>
            <span class="btn btn-light btn-sm">ดูพอร์ตโฟลิโอ</span>
          </div>
        </a>
      </div>

    </div>

    <p class="text-center text-white-50 mt-5 mb-0">
      <small>&copy; 2026 — 42 Bangkok Discovery Piscine</small>
    </p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
	<head>
		<title>calculator pro max</title>
		<link rel="stylesheet" href="calc.css" />
	</head>

	<body>
		<form id="calc">
			<input id="left" type="text" />
			<select id="operator">
				<option value="+">+</option>
				<option value="-">-</option>
				<option value="*">*</option>
				<option value="/">/</option>
				<option value="%">%</option>
			</select>
			<input id="right" type="text" />
			<input type="submit" value="Try me!" />
		</form>
		<script src="calc.js"></script>
	</body>
</html>
